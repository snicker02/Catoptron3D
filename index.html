<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catoptron 3D</title>
<style>
/* Token set carried over from Catoptron 2D so the two tools read as siblings.
   No webfont link — same faces if installed, graceful system fallback otherwise,
   and no external dependency. */
:root{
  --bg:#0b0e13; --bg0:#0a0d12; --canv1:#121826;
  --hdr1:#131824; --hdr2:#0e1119;
  --panel:#141922; --panel2:#1a2130; --panel3:#161c28;
  --card:#151b28; --sunken:#10141c;
  --edge:#2b3547; --edge2:#26304a; --btnEdge:#34405a;
  --scroll:#2c3850; --valEdge:#3a4a68;
  --trk1:#33415c; --trk2:#22293a; --btn1:#232c3e;
  --txt:#dde5f1; --dim:#8a96ab; --label:#b7c2d6; --note:#5f6c84; --hint:#5c6880;
  --ice1:#8ab8ff; --ice2:#c8ecff; --h1a:#f2f7ff; --h1b:#6f87ad;
  --thumb1:#eef6ff; --warn1:#ffca7a; --warn2:#3a2f1c;
  --ok1:#5fe0b0; --bound1:#ffca7a; --cell1:#ff9d7a;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:'Space Grotesk',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);overflow:hidden;font-family:var(--disp);color:var(--txt)}
#c{display:block;position:fixed;inset:0;cursor:grab;background:var(--canv1)}
#c:active{cursor:grabbing}

#panel{
  position:fixed;top:0;left:0;width:300px;height:100vh;z-index:100;
  background:linear-gradient(180deg,var(--hdr1),var(--panel));
  border-right:1px solid var(--edge);
  overflow-y:auto;padding:14px 13px 40px;
  transition:transform .24s ease;
  scrollbar-width:thin;scrollbar-color:var(--scroll) transparent;
}
#panel.hidden{transform:translateX(-100%)}
#panel::-webkit-scrollbar{width:5px}
#panel::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:3px}

header h1{
  font-size:15px;font-weight:700;letter-spacing:.34em;color:var(--h1a);
  text-transform:uppercase;
}
header .sub{font-family:var(--mono);font-size:10.5px;color:var(--h1b);margin-top:3px;letter-spacing:.04em}
header .hint{font-family:var(--mono);font-size:10px;color:var(--hint);margin-top:7px;line-height:1.7}
hr{border:none;border-top:1px solid var(--edge2);margin:14px 0}

.group{margin-bottom:16px}
.group h2{
  font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.22em;
  color:var(--dim);text-transform:uppercase;
  border-bottom:1px solid var(--edge2);padding-bottom:5px;margin-bottom:9px;
}

.ctrl{margin-bottom:8px}
label{
  display:flex;justify-content:space-between;align-items:baseline;gap:6px;
  font-family:var(--mono);font-size:10px;color:var(--label);margin-bottom:4px;
}
label span{color:var(--ice2);font-variant-numeric:tabular-nums}
label span.baked{
  color:var(--ice1);opacity:.65;font-size:8.5px;letter-spacing:.1em;
  border:1px solid var(--edge);border-radius:3px;padding:0 4px;
}
input[type=range]{
  width:100%;height:3px;-webkit-appearance:none;appearance:none;display:block;
  background:linear-gradient(90deg,var(--trk1),var(--trk2));
  border-radius:2px;outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:11px;height:11px;border-radius:50%;
  background:var(--thumb1);border:1px solid var(--valEdge);cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:11px;height:11px;border-radius:50%;
  background:var(--thumb1);border:1px solid var(--valEdge);cursor:pointer;
}
input[type=range]:focus-visible{outline:2px solid var(--ice1);outline-offset:3px}
select{
  width:100%;background:var(--sunken);border:1px solid var(--edge);border-radius:5px;
  color:var(--txt);padding:5px 7px;font-family:var(--mono);font-size:10.5px;
  cursor:pointer;outline:none;
}
select:focus-visible{outline:2px solid var(--ice1);outline-offset:2px}

button{
  font-family:var(--mono);font-size:10.5px;color:var(--txt);cursor:pointer;
  background:linear-gradient(180deg,var(--btn1),var(--panel2));
  border:1px solid var(--btnEdge);border-radius:6px;padding:6px 10px;
}
button:hover{border-color:var(--valEdge);color:var(--h1a)}
button:focus-visible{outline:2px solid var(--ice1);outline-offset:2px}
.row{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.row select{flex:1}

/* fold cards */
.card{
  background:var(--card);border:1px solid var(--edge2);border-radius:7px;
  padding:9px;margin-bottom:8px;
}
.cardhead{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cname{font-family:var(--mono);font-size:11px;color:var(--ice2);flex:1}
.cbtns{display:flex;gap:3px}
button.mini{padding:1px 6px;font-size:11px;line-height:1.4;border-radius:4px}
.lip{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;
  border-radius:3px;padding:1px 5px;border:1px solid currentColor;opacity:.85;
}
.lip-exact{color:var(--ok1)}
.lip-bound{color:var(--bound1)}
.lip-repeat{color:var(--cell1)}
.warn{
  font-family:var(--mono);font-size:9px;line-height:1.6;color:var(--warn1);
  background:var(--warn2);border-radius:4px;padding:5px 7px;margin-bottom:8px;
}
.place{margin-top:6px;border-top:1px solid var(--edge2);padding-top:6px}
.place summary{
  font-family:var(--mono);font-size:9.5px;color:var(--note);cursor:pointer;
  list-style:none;margin-bottom:6px;letter-spacing:.08em;
}
.place summary::-webkit-details-marker{display:none}
.place summary::before{content:'\25B8  '}
.place[open] summary::before{content:'\25BE  '}
.empty{font-family:var(--mono);font-size:10px;color:var(--note);line-height:1.7}

#toggle{position:fixed;top:12px;left:312px;z-index:200}
#panel.hidden ~ #toggle{left:12px}
#hud{
  position:fixed;bottom:10px;right:12px;z-index:120;text-align:right;
  font-family:var(--mono);font-size:10px;color:var(--note);line-height:1.7;
  pointer-events:none;
}
#hud b{color:var(--ice1);font-weight:400}
#boot{
  position:fixed;top:50%;left:calc(50% + 150px);transform:translate(-50%,-50%);
  font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--ice1);
  z-index:150;pointer-events:none;
}
#boot.done{display:none}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
@media (max-width:720px){
  #panel{width:min(88vw,300px)}
  #toggle{left:12px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="boot">A S S E M B L I N G &nbsp; E S T I M A T O R</div>
<div id="panel">
  <header>
    <h1>Catoptron 3D</h1>
    <div class="sub">folded space, raymarched</div>
    <div class="hint">Drag to orbit &middot; scroll to zoom &middot; WASD orbit &middot; Q/E dolly &middot; Shift for fine</div>
  </header>
  <hr>

  <div class="group">
    <h2>Fold stack</h2>
    <div class="row">
      <select id="addOp" aria-label="Operator to add"></select>
      <button id="addBtn">add</button>
    </div>
    <div id="stack"></div>
    <div class="row" style="margin-top:8px">
      <button id="clearBtn">clear stack</button>
      <button id="pngBtn">save PNG</button>
    </div>
  </div>

  <div id="globals"></div>
</div>

<button id="toggle" aria-label="Toggle panel">☰</button>

<div id="hud">
  <div id="fps">-- fps</div>
  <div id="stat">shader --</div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
